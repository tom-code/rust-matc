name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  ble:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install BLE build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes libdbus-1-dev pkg-config
    - name: Build BLE library and all targets
      run: cargo build --locked --all-targets --features ble --verbose
    - name: Run BLE-enabled tests without hardware
      run: cargo test --locked --features ble --verbose
